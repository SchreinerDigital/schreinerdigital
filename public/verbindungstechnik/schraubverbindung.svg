<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#faf8f4"/>
  <!-- waagrechtes Bauteil (z. B. Korpusboden) -->
  <rect x="120" y="40" width="230" height="60" fill="#f2ede4" stroke="#6c6252" stroke-width="3"/>
  <!-- senkrechtes Bauteil (Korpusseite), Schmalkante nimmt Schraube auf -->
  <rect x="120" y="100" width="60" height="170" fill="#ffffff" stroke="#6c6252" stroke-width="3"/>
  <!-- Konfirmatschraube: Kopf, Schaft, Gewinde -->
  <circle cx="150" cy="60" r="10" fill="#f4e8d8" stroke="#ff7a1a" stroke-width="2.5"/>
  <line x1="150" y1="50" x2="150" y2="70" stroke="#1b1712" stroke-width="2"/>
  <rect x="145" y="70" width="10" height="140" fill="#f4e8d8" stroke="#ff7a1a" stroke-width="2.5"/>
  <path d="M145 150 h10 M145 162 h10 M145 174 h10 M145 186 h10 M145 198 h10" stroke="#ff7a1a" stroke-width="1.5"/>
</svg>
