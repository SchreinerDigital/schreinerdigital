<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#faf8f4"/>
  <!-- Werkstück, von links nach rechts durchlaufend -->
  <rect x="20" y="140" width="360" height="30" fill="#f2ede4" stroke="#6c6252" stroke-width="3"/>
  <!-- Kantenband-Rolle -->
  <circle cx="90" cy="90" r="26" fill="#ffffff" stroke="#6c6252" stroke-width="2.5"/>
  <circle cx="90" cy="90" r="8" fill="none" stroke="#6c6252" stroke-width="2"/>
  <path d="M90 116 v20 h34 v-20" fill="none" stroke="#928777" stroke-width="1.5"/>
  <!-- Leimtopf -->
  <path d="M150 100 h30 v25 h-30 Z" fill="#f4e8d8" stroke="#ff7a1a" stroke-width="2.5"/>
  <path d="M154 100 q11 -14 22 0" fill="none" stroke="#ff7a1a" stroke-width="2"/>
  <!-- Andrückrollen -->
  <circle cx="230" cy="128" r="16" fill="#f4e8d8" stroke="#ff7a1a" stroke-width="2.5"/>
  <circle cx="270" cy="128" r="16" fill="#f4e8d8" stroke="#ff7a1a" stroke-width="2.5"/>
  <!-- Bündigfräse/Besäumung -->
  <rect x="310" y="112" width="14" height="32" fill="#f4e8d8" stroke="#ff7a1a" stroke-width="2"/>
</svg>
